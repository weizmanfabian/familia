# Configuracion exclusiva de pruebas. Sustituye a la application.properties
# principal (que usa placeholders de .env resueltos solo en main()).
# El datasource lo inyecta Testcontainers via @DynamicPropertySource.

spring.application.name=familia-test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
