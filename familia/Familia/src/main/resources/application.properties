# ============================================
# CONFIGURACION COMUN (aplica a todos los perfiles)
# ============================================

spring.application.name=${APP_NAME}
server.servlet.context-path=${APP_CONTEXT_PATH}
server.port=${APP_PORT_IN}

# Perfil activo: cambia aqui a 'dev' o 'prod' para alternar perfil
# cuando corres localmente desde el IDE. En docker-compose, la env var
# SPRING_PROFILES_ACTIVE=prod sobrescribe este valor automaticamente.
spring.profiles.active = dev

# Driver y pool de conexiones (igual en dev y prod)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
